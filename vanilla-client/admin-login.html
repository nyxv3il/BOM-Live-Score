<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOM Live Score | Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="nav-shell" data-nav></nav>

      <main class="admin-login-wrap">
        <form id="loginForm" class="admin-login-card neon-card">
          <h1 class="admin-title">ADMIN</h1>
          <p class="admin-subtitle">Secure Login Required</p>

          <div class="field-wrap">
            <label for="username">Username</label>
            <input id="username" name="username" placeholder="Enter your username" required />
          </div>

          <div class="field-wrap">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required />
          </div>

          <button class="login-btn" type="submit"><i class="fas fa-lock"></i> LOGIN</button>
          <p id="loginMessage" class="form-message"></p>
        </form>
      </main>
    </div>

    <script src="./shared.js"></script>
    <script src="./api.js"></script>
    <script src="./admin-login.js"></script>
  </body>
</html>
