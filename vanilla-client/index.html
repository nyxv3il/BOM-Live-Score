<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOM Live Score</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="nav-shell" data-nav></nav>

      <main class="container">
        <section class="center hero-space">
          <div class="hero-pill"><i class="fas fa-futbol"></i> live match center</div>
          <h1 class="hero-heading"><span class="gradient" id="titleText">School A vs School B</span></h1>
        </section>

        <section class="score-panel center" aria-live="polite">
          <p class="section-label">Current Score</p>
          <p class="score-big" id="scoreText">0/0</p>
          <p class="muted-large" id="metaText">0 overs | RR 0.00</p>
        </section>

        <section class="metric-grid">
          <article class="metric-card">
            <p class="card-label">Team A</p>
            <h2 id="teamAName">School A</h2>
            <p class="card-sub" id="teamAStatus">Fielding</p>
          </article>

          <article class="metric-card">
            <p class="card-label card-label-primary">On Strike</p>
            <h2 class="primary" id="onStrike">-</h2>
            <p class="card-sub" id="onStrikeStats">-</p>
          </article>

          <article class="metric-card">
            <p class="card-label">Non-Striker</p>
            <h2 class="muted" id="nonStrike">-</h2>
            <p class="card-sub" id="nonStrikeStats">-</p>
          </article>

          <article class="metric-card">
            <p class="card-label">Bowler</p>
            <h2 class="muted" id="bowler">-</h2>
            <p class="card-sub" id="bowlerStats">-</p>
          </article>

          <article class="metric-card">
            <p class="card-label">Partnership</p>
            <h2 class="muted" id="partnership">-</h2>
            <p class="card-sub">Current partnership</p>
          </article>

          <article class="metric-card span-all">
            <p class="card-label card-label-primary">Recent Balls</p>
            <div class="balls" id="recentBalls"></div>
          </article>
        </section>

        <section class="timeline-wrap">
          <h2 class="timeline-title">Match Series Timeline</h2>
          <div class="timeline-grid" id="timelineGrid"></div>
        </section>

        <section class="center actions-row">
          <a class="cta-btn" href="./summary.html">View Series Summary</a>
          <a class="cta-btn secondary" href="./credits.html">View Credits</a>
        </section>
      </main>
    </div>

    <script src="./shared.js"></script>
    <script src="./api.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
